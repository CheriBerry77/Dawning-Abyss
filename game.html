:root{--bg:#161b21;--pn:#212a33;--ink:#ece1c4;--dim:#8d8b7e;--gold:#d2aa4e;--red:#c0485a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:28px/1.15 Silver,monospace;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:64px;margin:6px 0 0;color:var(--gold);font-weight:400;line-height:1}
h2{font-size:38px;margin:0 0 6px;font-weight:400}
small,.dim{color:var(--dim);font-size:19px}
.sub{font-size:24px;color:var(--dim);margin:6px 0 14px}
button{font:inherit;color:var(--ink);background:var(--pn);border:3px double var(--gold);padding:6px 10px;cursor:pointer;text-align:left}
button:hover:not(:disabled),button:focus-visible{background:#33404c;outline:2px solid var(--ink);outline-offset:1px}
button:disabled{opacity:.4;cursor:default}
.box{border:3px double var(--gold);background:var(--pn);padding:10px}
#sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin-bottom:12px}
#sg button{font-size:24px;border-color:var(--c);border-style:solid}
#sg button.on{background:var(--c);color:#14181d}
.sq{margin:8px 0}.sq b{font-weight:400;color:var(--gold)}
.sq div{font-size:24px;padding-left:12px}.sq span{color:var(--dim);font-size:19px}
.go{margin-top:10px;font-size:34px;background:var(--red);border-color:var(--ink)}
.art i{display:inline-block;width:var(--cw);text-align:center;font-style:normal;white-space:pre}
.art div{height:var(--lh);line-height:var(--lh);white-space:nowrap}
#hud{display:grid;gap:4px;font-size:22px;margin-bottom:10px}
#map{font-size:clamp(11px,3.1vw,19px);padding:6px;overflow-x:auto;width:max-content;max-width:100%;margin:0 auto 10px}
#map div{height:1.15em;line-height:1.15em;white-space:nowrap}
#map i{display:inline-block;width:.9em;text-align:center;font-style:normal;color:#4a5662}
#map .w{color:#3a444f}#map .p{color:#fff;background:var(--red)}#map .e{color:var(--red)}#map .h{color:var(--gold)}
#map.box{font-size:clamp(10px,2.6vw,19px)}
#map div.mm{height:auto;line-height:normal;white-space:normal}
#map .mm div{height:.9em;line-height:.9em;white-space:nowrap}
#map .mm i{width:.5em;color:#46525e;background:none}
#map .mm .rf{color:#b5604f}#map .mm .wl{color:#8a8778}#map .mm .wn{color:#e0c05e}#map .mm .dr{color:#b08450}#map .mm .ch{color:#f2d36b}#map .mm .lp{color:#f2d36b}#map .mm .pl{color:#fff}#map .mm .en{color:#e8665e}
#log{min-height:3.5em;font-size:24px;margin-bottom:10px}
#dpad{display:grid;grid-template-columns:repeat(3,64px);gap:4px;justify-content:center}
#dpad button{text-align:center;padding:4px}
#stage{background:#10151a;border:3px double var(--gold);padding:8px;display:grid;gap:10px;font-size:clamp(24px,5.5vw,38px)}
.r1,.r2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ib{background:var(--pn);border:3px solid var(--ink);padding:6px 10px;font-size:19px;min-width:170px;line-height:1.2}
.ib .nm{font-size:24px}.ib .nm span{color:var(--gold);font-size:19px}
.hit{animation:blink .25s 2}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.hit{animation:none;opacity:.4}}
.s{padding:0 4px;color:#14181d;background:var(--gold)}
#bottom{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:8px}
@media(max-width:560px){#bottom{grid-template-columns:1fr}}
#msg{min-height:116px;padding:10px;border:3px double var(--gold);background:var(--pn);font-size:26px;cursor:pointer}
#menu{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
#menu button{font-size:24px;border-width:3px;border-style:double}
#menu button small{display:block;line-height:1.1}

const art=(s,cw,lh,col)=>`<div class=art style="--cw:${cw}em;--lh:${lh}em;${col?'color:'+col:''}">`+s.split('\n').map(r=>'<div>'+[...r].map(c=>`<i>${c==' '?'&nbsp;':c=='<'?'&lt;':c=='&'?'&amp;':c}</i>`).join('')+'</div>').join('')+'</div>';
const bar=(v,m,n=18)=>{const k=Math.max(v>0?1:0,Math.round(v/m*n)),c=v/m>.5?'#7fcf7a':v/m>.2?'#e5c34f':'#e8665e';return art('['+'#'.repeat(k)+'-'.repeat(n-k)+']',.5,.9,c)};
const MAP=['##################################','#................................#','#.####.####.###.#####.####.#####.#','#.####.####.#H#.#####.####.#####.#','#................................#','#.####.####.###.#####.####.#####.#','#.####.####.###.#####.####.#####.#','#................................#','#.####.####.###.#####.####.#####.#','#.####.####.###.#####.####.#####.#','#................................#','##################################'];
const IT={pot:['Healing Potion','Restores 40 HP'],pel:['Spirit Pellet','+5 PP to every move'],sal:['Cure Salve','Cures status and resets stat changes']};
let G={},sel=0,keyh=null;
const setScreen=h=>{$('#app').innerHTML=h};

function selectScreen(){
  keyh=null;
  setScreen(`<h1>Tingen Nights</h1><p class=sub>Beyond the fog, potions grant power and cost sanity. Choose the Pathway whose Sequence 9 potion you will drink.</p><div id=sg>${PATHS.map((p,i)=>`<button data-i=${i} style="--c:${TY[p.t][1]}">${p.n}</button>`).join('')}</div><div id=sd class=box></div>`);
  $('#sg').onclick=e=>{const b=e.target.closest('button');if(b){sel=+b.dataset.i;detail()}};detail();
}
function detail(){
  [...$('#sg').children].forEach((b,i)=>b.classList.toggle('on',i==sel));
  const P=PATHS[sel];
  $('#sd').innerHTML=`<h2 style="color:${TY[P.t][1]}">${P.n} Pathway <small>${TY[P.t][0]} type</small></h2>`+P.seqs.map((s,i)=>`<div class=sq><b>Sequence ${9-i}: ${s.n}</b>${s.moves.map(m=>`<div>${m.n} <span>${TY[m.t][0]} · ${m.pw?'Pow '+m.pw:'Status'} · ${m.ac}% · ${m.pp} PP${fxt(m)}</span></div>`).join('')}</div>`).join('')+`<button class=go id=go>Drink the ${P.seqs[0].n} potion</button>`;
  $('#go').onclick=()=>start(sel);
}
function mk(p,seq,foe){
  const P=PATHS[p],b=BASE[seq],j=()=>foe?.9+Math.random()*.2:1,moves=[];
  for(let s=9;s>=seq;s--)P.seqs[9-s].moves.forEach(m=>moves.push({...m,mp:m.pp}));
  const hp=Math.round(b[0]*j());
  return{p,seq,foe,sn:P.seqs[9-seq].n,t:P.t,mhp:hp,hp,A:b[1]*j(),D:b[2]*j(),S:b[3]*j(),L:b[4],st:{A:0,D:0,S:0},stat:null,sl:0,cn:0,prot:false,moves};
}
function start(p){
  G={pi:p,seq:9,dig:0,me:mk(p,9),items:{pot:3,pel:2,sal:2},x:1,y:10,en:[],log:`You awaken as a ${PATHS[p].seqs[0].n}. Tingen’s gaslit streets are alive with Beyonders.`};
  for(let i=0;i<4;i++)spawn();city();
}
function spawn(){let x,y;do{x=rnd(34);y=rnd(12)}while(MAP[y][x]!='.'||Math.abs(x-G.x)+Math.abs(y-G.y)<6);G.en.push({x,y,pi:rnd(22)})}
const need=()=>G.seq==9?3:G.seq==8?7:0;
function city(){
  const m=G.me,n=need();
  setScreen(`<div id=hud class=box><div>${PATHS[G.pi].n} Pathway · Sequence ${G.seq}: ${m.sn}</div><div class=dim>HP ${m.hp}/${m.mhp} ${bar(m.hp,m.mhp)}</div><div class=dim>Digestion ${n?bar(G.dig,n,18)+' '+G.dig+'/'+n:'Sequence 7 mastered. Sequence 6 awaits beyond this demo.'}</div><div class=dim>Bag: ${Object.keys(IT).map(k=>IT[k][0]+' x'+G.items[k]).join(' · ')}</div></div><div id=map class=box></div><div id=log class=box></div><div id=dpad><span></span><button data-d=u aria-label=Up>W</button><span></span><button data-d=l aria-label=Left>A</button><button data-d=d aria-label=Down>S</button><button data-d=r aria-label=Right>D</button></div><p class=dim>Walk with WASD or arrows. Touch a <span style="color:var(--red)">red figure</span> to fight. Enter the church (<span style="color:var(--gold)">H</span>) to rest.</p>`);
  drawMap();$('#log').textContent=G.log;
  $('#dpad').onclick=e=>{const b=e.target.closest('button');if(b)step(b.dataset.d)};
  keyh=e=>{const d={w:'u',arrowup:'u',s:'d',arrowdown:'d',a:'l',arrowleft:'l',d:'r',arrowright:'r'}[e.key.toLowerCase()];if(d){e.preventDefault();step(d)}};
}
const wall=(x,y)=>{const c=MAP[y]&&MAP[y][x];return c=='#'||c=='H'};
function tileArt(x,y){
  const c=MAP[y][x];
  if(c=='.'){
    const lamp=[1,6,11,15,21,26,32].includes(x)&&[1,4,7,10].includes(y)&&(x+y)%2==0;
    if(lamp)return[[' (*) ','  |  ','_/|\\_'],'lp'];
    const p=[['.  . ',' .  .','.  . '],[' . . ','. . .',' . . '],['  .  ','.  . ','  .  ']][(x*3+y*5)%3];
    return[wall(x,y-1)?[',,,,,',p[1],p[2]]:p,'st'];
  }
  if(c=='H')return[[' _+_ ','/ + \\','|[H]|'],'ch'];
  const u=!wall(x,y-1),d=!wall(x,y+1),l=!wall(x-1,y),r=!wall(x+1,y);
  if(u)return[[(l?'/':'=')+'==='+(r?'\\':'='),(l?'/':':')+':::'+(r?'\\':':'),(l?'|':'#')+'###'+(r?'|':'#')],'rf'];
  if(x%4==3)return[['/---\\','| | |','|_|_|'],'dr'];
  if(x%2==0)return[['.___.','|[#]|',d?'=====':'|___|'],'wn'];
  return[['-----','|:::|',d?'=====':'|:::|'],'wl'];
}
function drawMap(){
  const VW=11,VH=7,cx=Math.max(0,Math.min(MAP[0].length-VW,G.x-5)),cy=Math.max(0,Math.min(MAP.length-VH,G.y-3));
  let h='';
  for(let ty=0;ty<VH;ty++){
    const row=[];
    for(let tx=0;tx<VW;tx++){
      const x=cx+tx,y=cy+ty;let [L,c]=tileArt(x,y);
      if(x==G.x&&y==G.y){L=[' (o) ','/|@|\\',' / \\ '];c='pl'}
      else if(G.en.some(e=>e.x==x&&e.y==y)){L=[' ,^, ','(o_o)','/| |\\'];c='en'}
      row.push([L,c]);
    }
    for(let k=0;k<3;k++)h+='<div>'+row.map(([L,c])=>[...L[k]].map(ch=>`<i class=${c}>${ch}</i>`).join('')).join('')+'</div>';
  }
  $('#map').innerHTML='<div class=mm>'+h+'</div>';
}
function drawMapOld(){
  $('#map').innerHTML=MAP.map((r,y)=>'<div>'+[...r].map((c,x)=>{
    if(x==G.x&&y==G.y)return'<i class=p>@</i>';if(G.en.some(e=>e.x==x&&e.y==y))return'<i class=e>&amp;</i>';
    return c=='#'?'<i class=w>#</i>':c=='H'?'<i class=h>H</i>':'<i>.</i>'}).join('')+'</div>').join('');
}
const LINES=['Gas lamps hiss. Somewhere a clock tolls midnight.','A newspaper tumbles past: another unexplained disappearance.','A whisper in the fog repeats your name.','The scent of iron and candle wax lingers here.','A stray cat stares at you, then at something behind you.'];
let busy=false;
async function step(d){
  if(busy)return;const v={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[d],nx=G.x+v[0],ny=G.y+v[1];
  if(MAP[ny][nx]=='#')return;G.x=nx;G.y=ny;G.log=Math.random()<.2?LINES[rnd(LINES.length)]:'';
  if(MAP[ny][nx]=='H'){G.me.hp=G.me.mhp;G.me.moves.forEach(m=>m.mp=m.pp);G.log='The Church of the Evernight welcomes you. Your wounds close and your spirit settles.';}
  let hit=G.en.findIndex(e=>e.x==nx&&e.y==ny);
  if(hit<0){G.en.forEach(e=>{if(Math.random()<.6){const o=[[0,1],[0,-1],[1,0],[-1,0]][rnd(4)],tx=e.x+o[0],ty=e.y+o[1];if(MAP[ty]&&MAP[ty][tx]=='.')[e.x,e.y]=[tx,ty]}});hit=G.en.findIndex(e=>e.x==G.x&&e.y==G.y)}
  if(hit<0&&Math.random()<.04){G.en.push({x:G.x,y:G.y,pi:rnd(22),amb:1});hit=G.en.length-1}
  if(hit>=0){busy=true;const e=G.en.splice(hit,1)[0];await fight(e);busy=false}
  city();
}
// ---------- battle ----------
const nm=m=>m.foe?`The ${m.sn}`:'You',ps=m=>m.foe?`The ${m.sn}’s`:'Your';
const sm=(m,k)=>{const s=m.st[k];return s>=0?(2+s)/2:2/(2-s)};
let skip=false;
async function say(t,hold=600){const m=$('#msg');m.textContent='';skip=false;for(const c of t){m.textContent+=c;if(!skip)await sleep(12)}await sleep(skip?150:hold)}
function render(){
  const f=G.foe,m=G.me,box=(x,own)=>`<div class=ib><div class=nm>${own?'You':x.sn} <span>Seq ${x.seq}</span></div><div>${own?PATHS[x.p].n+' · '+x.sn:PATHS[x.p].n+' Pathway'}</div>${bar(x.hp,x.mhp)}<div>${own?x.hp+'/'+x.mhp+' ':''}${x.stat?`<b class=s>${x.stat.toUpperCase()}</b> `:''}${Object.entries(x.st).filter(e=>e[1]).map(e=>e[0]+(e[1]>0?'+':'')+e[1]).join(' ')}</div></div>`;
  $('#fb').innerHTML=box(f,0);$('#pb').innerHTML=box(m,1);
}
const flash=m=>{const e=$(m.foe?'#fs':'#ps');e.classList.add('hit');setTimeout(()=>e.classList.remove('hit'),500)};
function pick(f){
  const mv=f.moves.filter(m=>m.mp>0);if(!mv.length)return{n:'Desperate Strike',pw:40,ac:100,mp:1,fx:'recoil',t:f.t};
  const w=mv.map(m=>m.fx=='prot'?(f.lp?0:1):m.fx=='heal'?(f.hp<f.mhp*.5?5:.2):m.pw?3:1),T=w.reduce((a,b)=>a+b);let r=Math.random()*T;
  for(let i=0;i<mv.length;i++){r-=w[i];if(r<=0){f.lp=mv[i].fx=='prot';return mv[i]}}return mv[0];
}
async function act(a,d,mv){
  if(a.stat=='slp'){if(--a.sl>0){await say(`Slumber holds ${nm(a)}.`);return}a.stat=null;render();await say(`${nm(a)} woke up!`)}
  if(a.stat=='stn'){a.stat=null;render();await say(`Stunned! ${nm(a)} lost the turn.`);return}
  if(a.stat=='cnf'){if(--a.cn<=0){a.stat=null;render();await say(`${nm(a)} shook off the confusion.`)}else if(Math.random()<.33){a.hp=Math.max(0,a.hp-Math.max(2,Math.floor(a.mhp*.1)));flash(a);render();await say(`Confusion strikes ${nm(a)}!`);return}}
  mv.mp--;await say(`${nm(a)} used ${mv.n}!`,300);
  if(mv.fx=='prot'){a.prot=true;await say(`A shield rises around ${nm(a)}.`);return}
  const foeTarget=mv.pw>0||/^(f\.|burn|psn|slp|cnf|stn)/.test(mv.fx);
  if(foeTarget&&d.prot){await say('The attack was deflected!');return}
  if(foeTarget&&Math.random()*100>=mv.ac){await say(`${nm(a)} missed!`);return}
  let tot=0;
  if(mv.pw){
    const e=eff(mv.t,d.t),c=Math.random()<(mv.fx=='crit'?.25:.0625);
    for(let i=0;i<(mv.fx=='x2'?2:1);i++){
      let dm=Math.floor(((2*a.L/5+2)*mv.pw*(a.A*sm(a,'A')*(a.stat=='burn'?.5:1))/(d.D*sm(d,'D')))/50+2);
      dm=Math.max(1,Math.floor(dm*(mv.t==a.t?1.5:1)*e*(c?1.5:1)*(.85+Math.random()*.15)));tot+=dm;d.hp=Math.max(0,d.hp-dm);flash(d);render();await sleep(250)}
    if(c)await say('A critical hit!',300);
    if(e>1)await say('It’s super effective!',400);if(e<1)await say('It’s not very effective...',400);
    if(mv.fx=='drain'){a.hp=Math.min(a.mhp,a.hp+Math.ceil(tot/2));render();await say(`${nm(a)} drained life force!`,300)}
    if(mv.fx=='recoil'){a.hp=Math.max(0,a.hp-Math.max(2,Math.floor(a.mhp*.1)));render();await say(`${nm(a)} was hurt by the recoil!`,300)}
  }
  if(d.hp<=0)return;
  const [k,s]=mv.fx.split('.'),who=k=='u'?a:d;
  if((k=='u'||k=='f')&&s){const delta=(mv.pw?1:2)*(k=='u'?1:-1);who.st[s]=Math.max(-6,Math.min(6,who.st[s]+delta));render();await say(`${ps(who)} ${{A:'ATK',D:'DEF',S:'SPD'}[s]} ${delta>0?'rose':'fell'}${Math.abs(delta)>1?' sharply':''}!`)}
  if(mv.fx=='heal'){a.hp=Math.min(a.mhp,a.hp+Math.floor(a.mhp/2));render();await say(`${nm(a)} recovered HP!`)}
  if(/^(burn|psn|slp|cnf|stn)$/.test(mv.fx)&&!d.stat&&Math.random()<(mv.pw?.3:1)){
    d.stat=mv.fx;d.sl=1+rnd(3);d.cn=2+rnd(3);render();
    await say({burn:`${nm(d)} caught fire!`,psn:`${nm(d)} was poisoned!`,slp:`${nm(d)} fell asleep!`,cnf:`${nm(d)} is confused!`,stn:`${nm(d)} is stunned!`}[mv.fx])}
}
async function round(pm,fm){
  const o=[[G.me,G.foe,pm],[G.foe,G.me,fm]],pr=x=>x[2].fx=='pri'?1:0,sp=x=>x[0].S*sm(x[0],'S');
  o.sort((a,b)=>pr(b)-pr(a)||sp(b)-sp(a)||Math.random()-.5);
  for(const [a,d,mv] of o){if(a.hp<=0||d.hp<=0)break;await act(a,d,mv)}
}
async function eot(){
  for(const x of [G.me,G.foe]){x.prot=false;if(x.hp>0&&(x.stat=='burn'||x.stat=='psn')){x.hp=Math.max(0,x.hp-Math.max(1,Math.floor(x.mhp/8)));flash(x);render();await say(x.stat=='burn'?`Flames sear ${nm(x)}.`:`Poison wracks ${nm(x)}.`,400)}}
}
function choose(){return new Promise(res=>{
  const M=$('#menu'),f=G.foe;
  const main=()=>{$('#msg').textContent='What will you do?';M.innerHTML='<button data-a=f>1. FIGHT</button><button data-a=b>2. BAG</button><button data-a=i>3. FOE INFO</button><button data-a=r>4. RUN</button>'};
  const fight=()=>{M.innerHTML=G.me.moves.map((m,i)=>`<button data-a=m data-i=${i} ${m.mp?'':'disabled'} style="border-color:${TY[m.t][1]}">${i+1}. ${m.n}<small>${TY[m.t][0]} · ${m.pw?'Pow '+m.pw:'Status'} · ${m.mp}/${m.pp} PP</small></button>`).join('')+'<button data-a=back>Back</button>'};
  const bag=()=>{M.innerHTML=Object.keys(IT).map((k,i)=>`<button data-a=t data-k=${k} ${G.items[k]?'':'disabled'}>${i+1}. ${IT[k][0]} x${G.items[k]}<small>${IT[k][1]}</small></button>`).join('')+'<button data-a=back>Back</button>'};
  const info=()=>{const T=Object.keys(TY),w=T.filter(t=>eff(t,f.t)>1).map(t=>TY[t][0]),r=T.filter(t=>eff(t,f.t)<1).map(t=>TY[t][0]);$('#msg').textContent=`${f.sn}, ${PATHS[f.p].n} Pathway (${TY[f.t][0]}). Weak to: ${w.join(', ')||'none'}. Resists: ${r.join(', ')||'none'}.`};
  M.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.a;
    if(a=='f')fight();else if(a=='b')bag();else if(a=='i')info();else if(a=='back')main();
    else if(a=='r'){M.onclick=null;M.innerHTML='';res({k:'run'})}
    else if(a=='m'){M.onclick=null;M.innerHTML='';res({k:'mv',mv:G.me.moves[+b.dataset.i]})}
    else if(a=='t'){M.onclick=null;M.innerHTML='';res({k:'item',i:b.dataset.k})}};
  keyh=e=>{if(e.key=='Escape')main();else if(/^[1-4]$/.test(e.key)){const b=M.children[+e.key-1];if(b)b.click()}};
  main();
})}
async function fight(en){
  const seq=Math.max(7,G.seq-(Math.random()<.35?1:0)),pi=en.amb?en.pi:en.pi,foe=mk(pi,Math.random()<.35?9:seq,true);
  G.foe=foe;const me=G.me;me.st={A:0,D:0,S:0};me.stat=null;me.prot=false;keyh=null;
  setScreen(`<div id=stage><div class=r1><div id=fb></div><div id=fs>${art(SPR[foe.p],.42,.8,TY[foe.t][1])}</div></div><div class=r2><div id=ps>${art(SPR[me.p],.42,.8,TY[me.t][1])}</div><div id=pb></div></div></div><div id=bottom><div id=msg></div><div id=menu></div></div>`);
  $('#msg').onclick=()=>skip=true;render();
  await say(`${en.amb?'Ambushed! ':''}A ${foe.sn} of the ${PATHS[pi].n} Pathway steps out of the fog!`);
  while(foe.hp>0&&me.hp>0){
    const c=await choose();keyh=null;const fm=pick(foe);
    if(c.k=='run'){if(Math.random()<.6){await say('You slip away into the fog.');return}await say('You can’t escape!');await act(foe,me,fm)}
    else if(c.k=='item'){G.items[c.i]--;
      if(c.i=='pot'){me.hp=Math.min(me.mhp,me.hp+40);await say('You drank a Healing Potion. HP restored!')}
      if(c.i=='pel'){me.moves.forEach(m=>m.mp=Math.min(m.pp,m.mp+5));await say('The Spirit Pellet restores your spirituality.')}
      if(c.i=='sal'){me.stat=null;me.st={A:0,D:0,S:0};await say('The Cure Salve clears your body and mind.')}
      render();await act(foe,me,fm)}
    else await round(c.mv,fm);
    if(foe.hp>0&&me.hp>0)await eot();
  }
  if(me.hp<=0){await say('Your vision fades as the fog swallows you...');G.x=13;G.y=4;me.hp=me.mhp;me.moves.forEach(m=>m.mp=m.pp);G.log='You wake at the doors of the Church of the Evernight, fully restored.';return}
  await say(`The ${foe.sn} collapses. Their Beyonder characteristic dissipates into you.`);
  const g=foe.seq==9?1:foe.seq==8?2:3;
  let log=`Victory! +${g} digestion.`;
  if(Math.random()<.5){const k=Object.keys(IT)[rnd(3)];G.items[k]++;log+=` Found a ${IT[k][0]}.`;await say(`You found a ${IT[k][0]}!`)}
  G.dig+=g;
  if(need()&&G.dig>=need()){
    G.seq--;G.dig=0;const old=G.me.hp/G.me.mhp;G.me=mk(G.pi,G.seq);
    const S=PATHS[G.pi].seqs[9-G.seq];
    await say(`Your potion is fully digested! You advance to Sequence ${G.seq}: ${S.n}.`,900);
    await say(`New abilities: ${S.moves.map(m=>m.n).join(', ')}.`,900);
    log=`Advanced to Sequence ${G.seq}: ${S.n}! You are fully restored.`;
  }
  G.log=log;
}
addEventListener('keydown',e=>{if(keyh)keyh(e)});
selectScreen();
