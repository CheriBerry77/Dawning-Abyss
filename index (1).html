<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fathoms 'Til Dawn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#050d14;overflow:hidden;font-family:'Press Start 2P',monospace;color:#e8fbff}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;cursor:none;background:#14506b}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(3,15,25,.85);text-align:center;font-size:11px;line-height:1.9;padding:16px}
.ov.on{display:flex}
h1,h2{margin:0;color:#ffd23f;font-size:clamp(16px,3.6vw,28px);line-height:1.4}
h2{color:#ff6f61}
p{margin:0;max-width:560px;color:#a9d6e8}
button{font:inherit;font-size:12px;color:#050d14;background:#ffd23f;border:0;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #b88a00}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
button:focus-visible{outline:3px solid #fff}
#cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{width:190px;min-height:150px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;color:#e8fbff;background:#0f3a52;border:3px solid #4cc9f0;box-shadow:none;font-size:9px;line-height:1.7}
.card:hover,.card:focus-visible{background:#15506f;border-color:#ffd23f}
.card b{color:#ffd23f;font-size:10px;font-weight:normal}
.card i{color:#7fd8f5;font-style:normal}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="start" class="ov on">
  <h1>Fathoms 'Til Dawn</h1>
  <p>Survive the deep. Absorb the traits of the sea's best predators.</p>
  <p>WASD swim. Mouse aims. Hold click to fire. R reloads. Space lunges once you've chosen the Frogfish.</p>
  <button id="btnStart">Dive in</button>
</div>

<div id="lvl" class="ov">
  <h1>Evolve</h1>
  <p>Pick a trait (or press 1, 2, 3)</p>
  <div id="cards"></div>
</div>

<div id="over" class="ov">
  <h2>Lost to the deep</h2>
  <p id="overText"></p>
  <button id="btnRetry">Dive again</button>
</div>

<script src="game.js"></script>
</body>
</html>
